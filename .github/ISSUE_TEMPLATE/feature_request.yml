name: Feature request
description: Something the integration should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project's roadmap is built almost entirely out of things people
        ran into while using it — the ignore zones, the wind at the fire and
        the intensity colours all started as a post from someone who had a
        problem. So the useful part of a request is usually the problem, not
        the solution.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot do today?
      description: >-
        The situation, not the feature. What did you want to know or be told,
        and what happened instead?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing about it right now
      description: >-
        A template, a helper, another integration, Node-RED, or nothing.
        Existing workarounds are the strongest argument a request can carry —
        they show what is actually missing.

  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
      description: Optional. Skip it if you would rather leave the shape open.

  - type: markdown
    attributes:
      value: |
        **One thing this integration will not do:** score your risk, or tell
        you whether you are safe. It reports what the satellites and the
        weather model observed and leaves the judgement to you. Requests that
        need a verdict — a threat level, a "no action needed", an automatic
        "that is not a real fire" — get declined for that reason and not
        because they are bad ideas.

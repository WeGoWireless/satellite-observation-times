blueprint:
  name: NASA FIRMS — fire within a set distance
  homeassistant:
    min_version: 2025.6.0
  description: >-
    Alerts you when the nearest satellite-detected fire comes closer than a
    distance you set.


    **What it can and cannot see.** It watches the *nearest* fire and triggers
    on the moment that distance crosses your line from outside to inside. Two
    consequences, both worth knowing before you wonder why it stayed quiet.
    If a fire is **already** closer than your distance when you set this up,
    nothing fires — the line has to be crossed, and it was crossed before the
    automation existed. And if a fire is already inside and a second, closer
    one appears, the distance just drops further, which is not a crossing
    either. Both are the same missing piece: a later release adds a proper
    "new fire" signal and this blueprint will be rebuilt on it.


    **The wind sentence** is only added when a wind reading exists, and it
    describes the wind at that fire's own coordinates right now: whether the
    air is currently carrying smoke towards you, past you, or away. That is
    geometry, not a safety assessment. Wind turns, slope and fuel matter as
    much, and "away from you" is never an all-clear. Your country's official
    warning channel stays the authority on whether to act.


    **Not a real-time alarm either.** Satellites pass a few times a day and
    processing adds up to about three hours, so a fire can burn for a while
    before it exists in this data at all.
  domain: automation
  source_url: https://github.com/bangboomben/ha-nasa-firms/blob/main/blueprints/automation/nasa_firms/fire_within_distance.yaml
  input:
    distance_sensor:
      name: Nearest hotspot sensor
      description: >-
        The "Nearest hotspot" sensor of the location you want to watch. With
        several configured locations, pick the one this alert is about.
      selector:
        entity:
          filter:
            - integration: nasa_firms
              domain: sensor
              device_class: distance
    threshold:
      name: Alert distance
      description: >-
        Alert when the nearest fire is closer than this, **in the unit that
        sensor displays** — kilometres on a metric instance, miles on a US one,
        or whatever you set for it under Settings → Entities. Worth setting well
        inside the radius you configured, so the alert means something more
        than "there is a fire somewhere in my area".
      default: 10
      selector:
        number:
          min: 1
          max: 500
          step: 1
          mode: box
    notification:
      name: What should happen
      description: >-
        Usually a notification. Two variables are ready for you to use:
        `{{ title }}` and `{{ message }}` — the message already contains the
        distance, the direction, the nearest town and, when it is known, the
        wind sentence.
      selector:
        action: {}

mode: single
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: !input distance_sensor
    below: !input threshold

variables:
  sensor: !input distance_sensor
  limit: !input threshold
  # Taken from the entity instead of written out: the sensor carries
  # `device_class: distance`, so Home Assistant displays it in the instance's
  # unit system and lets it be overridden per entity — a US instance reads
  # miles. The trigger compares against that displayed value, so an alert that
  # says "km" regardless would put the wrong label on a right number.
  unit: "{{ state_attr(sensor, 'unit_of_measurement') or 'km' }}"
  title: Fire within {{ limit }} {{ unit }}
  # Built in one place so the wind half can be left out cleanly when there is
  # no reading, rather than printing "wind unknown" into an alert.
  # `rounded=True` asks for the state at the entity's display precision: the
  # raw state after a unit conversion is the unrounded float, so an instance
  # showing miles would read out 14 decimal places here.
  message: >-
    {%- set dir = state_attr(sensor, 'direction') -%}
    {#- The place lives on the fire, not on this sensor: several fires means
        no single correct value, so the sensor points at one instead. The id
        can be missing for a moment after a restart, before Home Assistant
        has added the fire entities. -#}
    {%- set fire_entity = state_attr(sensor, 'nearest_entity_id') -%}
    {%- set place = state_attr(fire_entity, 'place_name') if fire_entity else none -%}
    {%- set place_km = state_attr(fire_entity, 'place_distance_km') if fire_entity else none -%}
    {#- 25 km is the cut-off the recipes use: past it the nearest listed town
        says more about how empty the map is than about where the fire is. -#}
    {%- set where = none if place is none else
        ('near ' ~ place if place_km is not none and place_km <= 25
         else 'in open country') -%}
    {%- set fire = state_attr(sensor, 'bearing') -%}
    {%- set wind = state_attr(sensor, 'wind_bearing') -%}
    {%- set off = (((wind - fire) + 180) % 360 - 180) | abs
        if (fire is not none and wind is not none) else none -%}
    {%- set drift = none if off is none else
        ('towards you' if off <= 60 else
        ('past you to one side' if off <= 120 else 'away from you')) -%}
    Fire detected {{ states(sensor, rounded=True) }} {{ unit }}{{ ' ' ~ dir if dir else '' }}{{ ', ' ~ where if where else '' }}.
    {{- '' if off is none else
        ' Wind at the fire is pushing the smoke ' ~ drift ~
        ' (' ~ (off | round) ~ '° off the line to you).' }}

actions: !input notification
